delay_cost:
  # Airlines for America (A4A) 2023-2024 direct aircraft operating cost per minute benchmark:
  # Baseline average narrowbody direct operating cost per minute = $85.50
  direct_operating_cost_per_min: 85.50
  direct_cost_components:
    fuel_per_min: 35.20
    crew_per_min: 26.80
    maintenance_per_min: 15.10
    aircraft_ownership_per_min: 8.40
  
  # FAA / US DOT Passenger Value of Time (PVOT) benchmark ($/hour converted to $/minute per pax)
  # DOT guidance is ~$47/hr for all-purpose personal/business blend ~= $0.783/min
  passenger_value_of_time_per_min: 0.783

  # Multipliers and average seat capacities by aircraft size category
  aircraft_categories:
    Regional:
      direct_cost_multiplier: 0.70
      avg_seats: 76
    Narrowbody:
      direct_cost_multiplier: 1.00
      avg_seats: 162
    Widebody:
      direct_cost_multiplier: 1.65
      avg_seats: 285

  # Delay thresholds
  dot_buffer_minutes: 15 # Flights within 15 min considered DOT A14 on-time, but direct operating buffer can be set to 0 or 15
  apply_cost_threshold_minutes: 0 # Calculate economic cost for all minutes delayed past scheduled time

scrape_pricing:
  headless: true
  min_delay_sec: 1.5
  max_delay_sec: 4.0
  max_retries: 3
  backoff_factor: 1.8
  timeout_ms: 30000
  default_cabin_class: "economy"
  days_ahead: 14
  search_window_days: 7
  # Skyscanner scraping disclaimer:
  # Automated scraping may breach Skyscanner's Terms of Service.
  # For production use, register for the official Skyscanner Travel API (RapidAPI or Partners portal).

opensky:
  active_provider: "zenodo" # "zenodo" or "trino"
  trino:
